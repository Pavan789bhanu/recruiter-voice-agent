[project]
name = "recruiter-voice-agent"
version = "1.0.0"
description = "AI-powered voice agent for recruiter calls"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B104", "B108"]
